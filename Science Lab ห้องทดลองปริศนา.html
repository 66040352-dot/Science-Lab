<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Science Lab ห้องทดลองปริศนา</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&family=Mitr:wght@500;600&display=swap">
<style>
/* Layout: one lab bench (a single column, max 720px) on a tiled lab wall.
   A sticky HUD carries the test-tube rack (6 rooms), lives and score. */
:root{
  --wall:#e6eeeb; --tile:#d5e1dd; --bench:#fbfdfc; --bench-2:#f0f5f3;
  --ink:#15302b; --ink-2:#4b6862; --line:#cbd9d4; --glass:#7f9f98;
  --accent:#6b3fa3; --accent-ink:#ffffff; --accent-soft:#eee6f8;
  --r1:#d0457b; --r2:#7d47b5; --r3:#3a6fd0; --r4:#14958f; --r5:#3c9a46; --r6:#d39b16;
  --water:#bfe3ef; --milk:#e9eeee; --yellowliq:#f3d77a; --amber:#d9a21c; --sand:#b28a56; --oil:#f0c94a; --pinkliq:#f1a8c4; --foam:#ffffff; --chalk:#fdfefe;
  --ok:#22804e; --ok-soft:#e0f2e7; --bad:#bd3d35; --bad-soft:#fbe5e2; --note-soft:#fff6dc;
  --f-display:"Mitr","Anuphan","Noto Sans Thai",system-ui,sans-serif;
  --f-body:"Anuphan","Noto Sans Thai",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --wall:#0e1a19; --tile:#162625; --bench:#152523; --bench-2:#1b2e2c;
    --ink:#e1eeea; --ink-2:#9fb8b2; --line:#2b403d; --glass:#6f918a;
    --accent:#b993e6; --accent-ink:#1b1027; --accent-soft:#2c2140;
    --r1:#ef7aa6; --r2:#b48ae6; --r3:#7ea6f2; --r4:#4cc7bf; --r5:#73c97c; --r6:#efc14a;
    --water:#3d6f80; --milk:#9fb1b0; --yellowliq:#c9a93f; --amber:#e8b93a; --sand:#c49a62; --oil:#d6b03d; --pinkliq:#b9567c; --foam:#dfe9e7; --chalk:#e9f0ef;
    --ok:#62c98f; --ok-soft:#173527; --bad:#f08077; --bad-soft:#3a1d1b; --note-soft:#332b14;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --wall:#0e1a19; --tile:#162625; --bench:#152523; --bench-2:#1b2e2c;
  --ink:#e1eeea; --ink-2:#9fb8b2; --line:#2b403d; --glass:#6f918a;
  --accent:#b993e6; --accent-ink:#1b1027; --accent-soft:#2c2140;
  --r1:#ef7aa6; --r2:#b48ae6; --r3:#7ea6f2; --r4:#4cc7bf; --r5:#73c97c; --r6:#efc14a;
  --water:#3d6f80; --milk:#9fb1b0; --yellowliq:#c9a93f; --amber:#e8b93a; --sand:#c49a62; --oil:#d6b03d; --pinkliq:#b9567c; --foam:#dfe9e7; --chalk:#e9f0ef;
  --ok:#62c98f; --ok-soft:#173527; --bad:#f08077; --bad-soft:#3a1d1b; --note-soft:#332b14;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background-color:var(--wall);
  background-image:linear-gradient(var(--tile) 1px,transparent 1px),linear-gradient(90deg,var(--tile) 1px,transparent 1px);
  background-size:44px 44px;
  color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 48px; min-height:100%;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--wall)}
#app{max-width:720px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:500;line-height:1.3;text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding-top:10px;margin-bottom:14px;background:linear-gradient(var(--wall) 70%,transparent)}
.hud-in{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--bench);border:1px solid var(--line);border-radius:14px;padding:8px 14px}
.brand{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.01em;margin-right:auto}
@media (max-width:480px){.brand{display:none}.hud-in{justify-content:space-between;gap:10px}}
.rack{display:flex;gap:4px;list-style:none;margin:0;padding:0}
.rack li{width:14px;height:30px;color:var(--c)}
.rack svg{display:block;width:14px;height:30px}
.rack .glass{fill:none;stroke:var(--glass);stroke-width:1.4}
.rack .fill{fill:currentColor;opacity:0}
.rack .is-done .fill{opacity:1}
.rack .is-now .glass{stroke:currentColor;stroke-width:2}
.rack .is-now .fill{opacity:.28}
.lives{display:flex;gap:3px;align-items:center}
.life{width:9px;height:22px;border:1.6px solid var(--glass);border-top-width:0;border-radius:0 0 6px 6px;position:relative;background:linear-gradient(transparent 45%,var(--r4) 45%)}
.life.is-broken{background:none;opacity:.35;transform:rotate(14deg)}
.score{display:flex;align-items:baseline;gap:6px;font-size:13px;color:var(--ink-2)}
.score b{font-family:var(--f-mono);font-size:18px;color:var(--ink);font-weight:600}

/* Stage */
.stage{background:var(--bench);border:1px solid var(--line);border-radius:16px;padding:22px 20px 20px;display:grid;gap:18px}
.room-head{display:grid;gap:6px;padding-left:14px;border-left:4px solid var(--c)}
.eyebrow{font-size:12.5px;letter-spacing:.06em;color:var(--ink-2);font-weight:600}
.room-head h1{font-size:26px}
.mission{color:var(--ink-2);max-width:62ch}
.step-meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);border-top:1px dashed var(--line);padding-top:12px}
.pts{font-family:var(--f-mono);font-size:12.5px;padding:2px 8px;border-radius:999px;background:var(--bench-2);border:1px solid var(--line);color:var(--ink-2)}
.q{font-size:19px;font-weight:500;max-width:60ch}
.ctx{display:grid;gap:10px}

/* Options */
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bench);cursor:pointer;line-height:1.5;min-height:48px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt-k{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--bench-2);border:1px solid var(--line);font-size:13px;font-weight:600}
.opt.is-sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.is-sel .opt-k{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.is-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.is-ok .opt-k{background:var(--ok);color:var(--bench);border-color:var(--ok)}
.opt.is-bad{border-color:var(--bad);background:var(--bad-soft);text-decoration:line-through;text-decoration-color:var(--bad)}
.opt:disabled{cursor:default}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] .opt-k{background:var(--accent);color:var(--accent-ink)}

/* Equipment grid */
.equip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:480px){.equip{grid-template-columns:repeat(2,minmax(0,1fr))}}
.eq{display:grid;justify-items:center;gap:4px;padding:12px 6px 10px;border-radius:12px;border:1.5px solid var(--line);background:var(--bench);cursor:pointer;color:var(--ink)}
.eq:hover:not(:disabled){border-color:var(--accent)}
.eq svg{width:52px;height:52px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.eq .ic-liq{fill:var(--water);stroke:none}
.eq .ic-merc{stroke:var(--bad);stroke-width:3}
.eq .ic-fill{fill:var(--bad);stroke:none}
.eq span{font-size:14.5px;font-weight:500}
.eq.is-sel{border-color:var(--accent);background:var(--accent-soft)}
.eq.is-ok{border-color:var(--ok);background:var(--ok-soft)}
.eq.is-bad{border-color:var(--bad);background:var(--bad-soft);opacity:.7}

/* Notebook clue */
.note{border:1px solid var(--line);border-radius:12px;background:var(--note-soft);padding:12px 16px 12px 44px;position:relative;background-image:repeating-linear-gradient(transparent 0 27px,var(--line) 27px 28px);background-position:0 10px;line-height:28px}
.note::before{content:"";position:absolute;left:28px;top:0;bottom:0;border-left:2px solid var(--r1);opacity:.5}
.note h3{font-size:14px;font-family:var(--f-body);font-weight:600;color:var(--ink-2);line-height:28px}
.note p{font-size:15px}
.note .pg{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);margin-right:6px}

/* Data table */
.tbl-wrap{overflow-x:auto}
table.data{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
table.data th,table.data td{border:1px solid var(--line);padding:8px 10px;text-align:left}
table.data th{background:var(--bench-2);font-weight:600;font-size:14px;white-space:nowrap}
table.data td:first-child{white-space:nowrap}
#sentence{font-family:var(--f-body);font-size:14.5px;line-height:1.6;min-height:130px}
table.data td.num{font-family:var(--f-mono);text-align:right}
table.data tr.row-bad td{background:var(--bad-soft)}
table.data tr.row-ok td{background:var(--ok-soft)}
table.data select{font:inherit;padding:6px 8px;border-radius:8px;border:1.5px solid var(--line);background:var(--bench);color:var(--ink);width:100%;min-width:9em}

/* Sorting cards */
.samples{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:560px){.samples{grid-template-columns:minmax(0,1fr)}}
.sample{display:grid;grid-template-columns:56px minmax(0,1fr);gap:4px 12px;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--bench)}
.sample.is-bad{border-color:var(--bad);background:var(--bad-soft)}
.sample.is-ok{border-color:var(--ok)}
.sample svg{grid-row:span 2;width:56px;height:60px}
.sample b{font-weight:600}
.sample .obs{font-size:14px;color:var(--ink-2);line-height:1.5}
.seg{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.seg button{padding:8px;border-radius:9px;border:1.5px solid var(--line);background:var(--bench-2);cursor:pointer;font-size:14px;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg button:disabled{cursor:default}
.why{grid-column:1/-1;font-size:13.5px;color:var(--bad)}

/* Ordering */
.order{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:560px){.order{grid-template-columns:minmax(0,1fr)}}
.order h3{font-size:14px;font-family:var(--f-body);font-weight:600;color:var(--ink-2);margin-bottom:6px}
.order ol{margin:0;padding:0;list-style:none;display:grid;gap:6px;counter-reset:s}
.order ol li{counter-increment:s;display:flex;gap:10px;padding:9px 12px;border-radius:10px;background:var(--accent-soft);border:1.5px solid var(--accent);font-size:15px;line-height:1.45}
.order ol li::before{content:counter(s);font-family:var(--f-mono);font-weight:600;color:var(--accent)}
.order ol.is-bad li{background:var(--bad-soft);border-color:var(--bad)}
.order ol.is-ok li{background:var(--ok-soft);border-color:var(--ok)}
.order .empty{font-size:14px;color:var(--ink-2);padding:10px;border:1.5px dashed var(--line);border-radius:10px}
.pool{display:grid;gap:6px}
.pool .opt{min-height:44px;font-size:15px;padding:9px 12px}

/* Scene */
.scene-box{display:grid;justify-items:center;gap:10px;background:var(--bench-2);border:1px solid var(--line);border-radius:14px;padding:14px}
.scene{width:100%;max-width:360px;height:auto}
.scene .glass{fill:none;stroke:var(--glass);stroke-width:2.4;stroke-linejoin:round}
.scene .tick{stroke:var(--glass);stroke-width:1.2}
.scene .lbl{font-family:var(--f-body);font-size:12.5px;fill:var(--ink-2)}
.scene .read{font-family:var(--f-mono);font-size:14px;font-weight:600;fill:var(--ink)}
.scene .tlbl{font-family:var(--f-mono);font-size:9px;fill:var(--ink-2)}
.scene .liq{fill:var(--liq-from);transform-box:fill-box;transform-origin:50% 100%}
.scene.go .liq,.scene.done .liq{fill:var(--liq-to)}
.scene.go .liq{transition:fill 1.6s ease .9s,transform 1s ease .2s}
.scene .bub{fill:var(--foam);stroke:var(--glass);stroke-width:.8;opacity:0;transform-box:fill-box}
.scene.go .bub{animation:rise 1.2s ease-in infinite;animation-delay:var(--d)}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-62px);opacity:0}}
.scene .foam{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0)}
.scene.go .foam{transition:transform 1.4s ease-out .7s}
.scene.go .foam,.scene.done .foam{transform:scaleY(1)}
.scene .powder{transform-box:fill-box}
.scene.go .powder,.scene.done .powder{transform:translateY(64px);opacity:0}
.scene.go .powder{transition:transform .7s ease-in,opacity .3s ease .55s}
.scene .drop{fill:var(--water);stroke:var(--glass);stroke-width:.8;opacity:0;transform-box:fill-box}
.scene.go .drop{animation:drip .55s ease-in 3;animation-delay:var(--d)}
@keyframes drip{0%{opacity:1;transform:translateY(0)}100%{opacity:1;transform:translateY(58px)}}
.scene .pp{opacity:0;transform:translateY(-46px);transform-box:fill-box}
.scene.go .pp{transition:opacity .8s ease 1.9s,transform 1.4s ease-in 1.9s}
.scene.go .pp,.scene.done .pp{opacity:1;transform:translateY(0)}
.scene .src{transform-box:fill-box;transform-origin:50% 100%}
.scene.go .src,.scene.done .src{transform:scaleY(0)}
.scene.go .src{transition:transform .9s ease .2s}
.scene.xy .liq{transform:scaleY(0)}
.scene.xy.go .liq,.scene.xy.done .liq{transform:scaleY(1)}
.scene .merc{fill:var(--bad)}
.obs-list{display:grid;gap:6px;margin:0;padding:0;list-style:none;width:100%}
.obs-list li{display:flex;gap:10px;align-items:baseline;padding:8px 12px;border-radius:10px;background:var(--bench);border:1px solid var(--line);font-size:15px}
.obs-list li::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--c,var(--accent));transform:translateY(-1px)}

/* Feedback */
.fb{border-radius:12px;padding:14px 16px;display:grid;gap:8px;border:1.5px solid}
.fb.ok{border-color:var(--ok);background:var(--ok-soft)}
.fb.bad{border-color:var(--bad);background:var(--bad-soft)}
.fb.reveal{border-color:var(--amber);background:var(--note-soft)}
.fb.note{border-color:var(--accent);background:var(--accent-soft)}
.fb h3{font-family:var(--f-body);font-weight:600;font-size:16px}
.fb dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:0;font-size:15px}
.fb dt{font-weight:600;color:var(--ink-2);font-size:13.5px;padding-top:1px}
.fb dd{margin:0}
.fb ul{margin:0;padding-left:18px;font-size:15px;display:grid;gap:4px}
.hints{display:grid;gap:6px}
.hint{font-size:15px;padding:10px 14px;border-radius:10px;background:var(--note-soft);border:1px dashed var(--amber)}
.hint b{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);margin-right:6px}

/* Actions */
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:12px;padding:12px 20px;font-weight:600;font-size:16px;cursor:pointer;min-height:48px;font-family:var(--f-display);letter-spacing:.01em}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(1.07)}
.btn-ghost{background:var(--bench);border:1.5px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px 2px;font-size:15px}

/* Start */
.start{display:grid;gap:22px;padding-top:28px}
.hero{background:var(--bench);border:1px solid var(--line);border-radius:18px;padding:24px 22px;display:grid;gap:14px;overflow:hidden}
.hero-rack{width:100%;max-width:420px;height:auto}
.hero h1{font-size:clamp(34px,8vw,52px);font-weight:600;letter-spacing:-.01em;line-height:1.05}
.hero h1 small{display:block;font-size:.5em;font-weight:500;color:var(--accent);margin-top:6px;letter-spacing:0}
.hero p{max-width:60ch;color:var(--ink-2)}
.rules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0;padding:0;list-style:none}
@media (max-width:520px){.rules{grid-template-columns:minmax(0,1fr)}}
.rules li{padding:10px 12px;border-radius:12px;background:var(--bench-2);border:1px solid var(--line);font-size:14.5px;line-height:1.5}
.rules b{display:block;font-family:var(--f-display);font-weight:500;font-size:15px}
.form{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
@media (max-width:520px){.form{grid-template-columns:1fr 1fr}.form .f-name{grid-column:1/-1}}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--ink-2)}
.field input,.field textarea{font:inherit;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bench);color:var(--ink);width:100%;min-width:0}
.field textarea{font-family:var(--f-mono);font-size:14px;min-height:150px;resize:vertical}

/* Room done / door / result */
.digit{font-family:var(--f-mono);font-size:44px;font-weight:600;width:72px;height:88px;display:grid;place-items:center;border-radius:14px;background:var(--bench-2);border:2px solid var(--c,var(--accent));color:var(--ink)}
.pieces{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.piece{display:grid;justify-items:center;gap:2px;padding:8px 0;border-radius:10px;border:1.5px solid var(--line);background:var(--bench-2)}
.piece .d{font-family:var(--f-mono);font-size:24px;font-weight:600;color:var(--c)}
.piece small{font-size:11.5px;color:var(--ink-2)}
.piece.is-empty .d{color:var(--line)}
.code-display{display:flex;justify-content:center;gap:8px}
.code-display span{width:44px;height:56px;border-radius:10px;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:26px;font-weight:600;background:var(--bench)}
.keypad{display:grid;grid-template-columns:repeat(3,minmax(0,72px));gap:8px;justify-content:center}
.keypad button{height:56px;border-radius:12px;border:1.5px solid var(--line);background:var(--bench);font-family:var(--f-mono);font-size:22px;font-weight:600;cursor:pointer}
.keypad button:hover{border-color:var(--accent)}
.msg-bad{color:var(--bad);text-align:center;font-weight:500}
.big-score{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.big-score b{font-family:var(--f-mono);font-size:64px;font-weight:600;line-height:1}
.big-score span{font-family:var(--f-mono);font-size:20px;color:var(--ink-2)}
.rank{display:inline-block;padding:6px 14px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:500}
.bars{display:grid;gap:10px}
.bar-row{display:grid;grid-template-columns:minmax(0,9.5em) minmax(0,1fr) 5.2em;gap:10px;align-items:center;font-size:14.5px}
.bar{height:12px;border-radius:6px;background:var(--bench-2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--accent));border-radius:6px}
.bar-row .v{font-family:var(--f-mono);text-align:right;font-size:13.5px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{padding:10px 12px;border-radius:12px;background:var(--bench-2);border:1px solid var(--line)}
.stat small{display:block;font-size:12.5px;color:var(--ink-2)}
.stat b{font-family:var(--f-mono);font-size:20px;font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;max-width:min(560px,calc(100% - 32px));background:var(--ink);color:var(--bench);padding:12px 16px;border-radius:12px;font-size:15px;box-shadow:0 6px 24px rgb(0 0 0 / .25)}
.section-title{font-size:20px}
.muted{color:var(--ink-2);font-size:14.5px}
.copybox{width:100%;font-family:var(--f-mono);font-size:12.5px;min-height:110px;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bench);color:var(--ink)}
.banner{padding:10px 14px;border-radius:10px;background:var(--note-soft);border:1px dashed var(--amber);font-size:14.5px}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:10px;background:var(--bad-soft);border:1px solid var(--bad);font-size:14.5px}

function animTemp(svg, t0, t1, dur, delay){
  const merc = svg.querySelector('.merc'), read = svg.querySelector('[data-read]');
  if (!merc || t0 === t1) return;
  const start = performance.now() + delay;
  const tick = now => {
    const p = Math.min(1, Math.max(0, (now - start) / dur));
    const t = t0 + (t1 - t0) * p, y = tempY(t);
    merc.setAttribute('y', y.toFixed(1)); merc.setAttribute('height', (186 - y).toFixed(1));
    read.textContent = t.toFixed(1) + ' °C';
    if (p < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
function playScene(svg, done){
  const c = SCENES[svg.dataset.scene];
  if (reduce){ svg.classList.remove('idle','go'); svg.classList.add('done'); const y = tempY(c.t1); svg.querySelector('.merc').setAttribute('y', y); svg.querySelector('.merc').setAttribute('height', 186 - y); svg.querySelector('[data-read]').textContent = c.t1.toFixed(1) + ' °C'; done(); return; }
  svg.classList.remove('done','go'); svg.classList.add('idle');
  const m = svg.querySelector('.merc'), y0 = tempY(c.t0); m.setAttribute('y', y0); m.setAttribute('height', 186 - y0); svg.querySelector('[data-read]').textContent = c.t0.toFixed(1) + ' °C';
  void svg.getBoundingClientRect();
  svg.classList.remove('idle'); svg.classList.add('go');
  animTemp(svg, c.t0, c.t1, 2200, 900);
  setTimeout(() => { svg.classList.remove('go'); svg.classList.add('done'); done(); }, 3500);
}

/* ---------- statistics (paired t-test) ---------- */
function gammaln(x){ const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5]; let y=x, tmp=x+5.5; tmp-=(x+0.5)*Math.log(tmp); let ser=1.000000000190015; for (let j=0;j<6;j++) ser+=c[j]/++y; return -tmp+Math.log(2.5066282746310005*ser/x); }
function betacf(a,b,x){ const MAXIT=300, EPS=3e-14, FPMIN=1e-300; const qab=a+b, qap=a+1, qam=a-1; let c=1, d=1-qab*x/qap; if (Math.abs(d)<FPMIN) d=FPMIN; d=1/d; let h=d;
  for (let m=1;m<=MAXIT;m++){ const m2=2*m; let aa=m*(b-m)*x/((qam+m2)*(a+m2)); d=1+aa*d; if (Math.abs(d)<FPMIN) d=FPMIN; c=1+aa/c; if (Math.abs(c)<FPMIN) c=FPMIN; d=1/d; h*=d*c;
    aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2)); d=1+aa*d; if (Math.abs(d)<FPMIN) d=FPMIN; c=1+aa/c; if (Math.abs(c)<FPMIN) c=FPMIN; d=1/d; const del=d*c; h*=del; if (Math.abs(del-1)<EPS) break; }
  return h; }
function ibeta(x,a,b){ if (x<=0) return 0; if (x>=1) return 1; const bt=Math.exp(gammaln(a+b)-gammaln(a)-gammaln(b)+a*Math.log(x)+b*Math.log(1-x)); return x<(a+1)/(a+b+2) ? bt*betacf(a,b,x)/a : 1-bt*betacf(b,a,1-x)/b; }
const mean = a => a.reduce((s,v) => s+v, 0) / a.length;
const sd = a => { const m = mean(a); return Math.sqrt(a.reduce((s,v) => s+(v-m)**2, 0) / (a.length-1)); };
function pairedT(pre, post){
  const n = pre.length, D = post.map((v,i) => v - pre[i]), md = mean(D), sdd = sd(D), df = n - 1;
  const t = sdd === 0 ? (md === 0 ? 0 : Infinity) : md / (sdd / Math.sqrt(n));
  const p2 = isFinite(t) ? ibeta(df/(df+t*t), df/2, 0.5) : 0;
  const p1 = t > 0 ? p2/2 : 1 - p2/2;
  return {n, df, mPre:mean(pre), sPre:sd(pre), mPost:mean(post), sPost:sd(post), md, sdd, t, p2, p1, d: sdd ? md/sdd : Infinity};
}
const EX_PRE = '4 6 5 7 3 6 5 6 4 5', EX_POST = '7 8 7 9 6 8 7 8 6 8';
const parseNums = s => s.split(/[\s,;]+/).map(v => v.trim()).filter(Boolean).map(Number);
const f2 = n => isFinite(n) ? n.toFixed(2) : '∞';
const fp = p => p < .001 ? '< .001' : p.toFixed(3).replace(/^0/,'');
const dLabel = d => { const a = Math.abs(d); return a >= .8 ? 'ใหญ่' : a >= .5 ? 'ปานกลาง' : a >= .2 ? 'เล็ก' : 'น้อยมาก'; };

  if (c.result){
    const r = c.result, full = Number(c.full) || 0, pct = v => full ? (v/full*100).toFixed(2) : '–';
    const sentence = `นักเรียนจำนวน ${r.n} คน มีคะแนนก่อนเรียนเฉลี่ย ${f2(r.mPre)} คะแนน (S.D. = ${f2(r.sPre)}) และหลังเรียนเฉลี่ย ${f2(r.mPost)} คะแนน (S.D. = ${f2(r.sPost)}) คะแนนเพิ่มขึ้นเฉลี่ย ${f2(r.md)} คะแนน ผลการทดสอบ Paired Samples t-test พบว่า t(${r.df}) = ${f2(r.t)}, p ${r.p1 < .001 ? '< .001' : '= ' + fp(r.p1)} (ทางเดียว) ขนาดอิทธิพล d = ${f2(r.d)} อยู่ในระดับ${dLabel(r.d)}`;
    out = `<div class="tbl-wrap"><table class="data"><thead><tr><th>การทดสอบ</th><th>N</th><th>x̄</th><th>S.D.</th><th>ร้อยละ</th><th>t</th><th>df</th><th>p (ทางเดียว)</th><th>p (สองทาง)</th><th>d</th></tr></thead><tbody>
      <tr><td>ก่อนเรียน</td><td class="num">${r.n}</td><td class="num">${f2(r.mPre)}</td><td class="num">${f2(r.sPre)}</td><td class="num">${pct(r.mPre)}</td><td class="num">${f2(r.t)}</td><td class="num">${r.df}</td><td class="num">${fp(r.p1)}</td><td class="num">${fp(r.p2)}</td><td class="num">${f2(r.d)}</td></tr>
      <tr><td>หลังเรียน</td><td class="num">${r.n}</td><td class="num">${f2(r.mPost)}</td><td class="num">${f2(r.sPost)}</td><td class="num">${pct(r.mPost)}</td><td></td><td></td><td></td><td></td><td></td></tr></tbody></table></div>
      <p class="muted">ผลต่างเฉลี่ย D̄ = ${f2(r.md)}, S<sub>D</sub> = ${f2(r.sdd)} · t ใช้ผลต่าง หลังเรียน − ก่อนเรียน จึงเป็นบวกเมื่อคะแนนเพิ่มขึ้น · d = D̄ / S<sub>D</sub></p>
      <div class="field"><label for="sentence">ข้อความสำหรับบทที่ 4</label><textarea id="sentence" class="copybox" readonly>${esc(sentence)}</textarea></div>
      <div class="actions" style="justify-content:flex-start"><button class="btn btn-ghost" data-act="copySentence">คัดลอกข้อความ</button></div>`;
  } else if (c.error){ out = `<p class="msg-bad" style="text-align:left">${esc(c.error)}</p>`; }
  return `<div class="start"><main class="stage">
   <div class="room-head" style="--c:var(--accent)"><span class="eyebrow">สำหรับครูและผู้วิจัย</span><h1>ผลการเล่นและสถิติ</h1><p class="mission">ดูคะแนนดิบที่บันทึกในเครื่องนี้ และคำนวณค่าสถิติคะแนนก่อน–หลังเรียน</p></div>
   <h2 class="section-title">ผลการเล่นในเครื่องนี้ (${list.length} รายการ)</h2>
   <div class="tbl-wrap"><table class="data"><thead><tr><th>ชื่อ</th><th>ชั้น</th><th>เลขที่</th><th>คะแนน</th><th>นาที</th><th>วันที่</th></tr></thead><tbody>${rows}</tbody></table></div>
   ${state.copyText ? `<textarea class="copybox" readonly id="copybox">${esc(state.copyText)}</textarea>` : ''}
   ${state.confirmClear ? `<div class="confirm"><span>ลบผลการเล่นทั้งหมดในเครื่องนี้? ลบแล้วกู้คืนไม่ได้</span><button class="btn btn-ghost" data-act="clearNo">ยกเลิก</button><button class="btn btn-primary" data-act="clearYes" style="background:var(--bad)">ลบทั้งหมด</button></div>` : ''}
   <div class="actions" style="justify-content:flex-start"><button class="btn btn-ghost" data-act="copyHistory" ${list.length ? '' : 'disabled'}>คัดลอกเป็น CSV</button><button class="btn btn-ghost" data-act="clearAsk" ${list.length ? '' : 'disabled'}>ลบทั้งหมด</button></div>
   <p class="muted">ผลเก็บไว้เฉพาะในเบราว์เซอร์ของเครื่องที่เล่น ถ้านักเรียนเล่นคนละเครื่อง ให้นักเรียนกด “คัดลอกผล” ที่หน้าสรุปแล้วส่งให้ครู</p>
   <h2 class="section-title" style="margin-top:8px">คำนวณ Paired Samples t-test</h2>
   <p class="muted">วางคะแนนแบบทดสอบก่อนเรียนและหลังเรียน เรียงตามเลขที่ให้ตรงกัน คั่นด้วยช่องว่าง จุลภาค หรือขึ้นบรรทัดใหม่</p>
   ${c.example ? `<p class="banner">ตัวเลขที่ใส่ไว้เป็นตัวอย่างสมมติ ไม่ใช่ข้อมูลจริง แทนที่ด้วยคะแนนของนักเรียนก่อนคำนวณ</p>` : ''}
   <div class="form" style="grid-template-columns:1fr 1fr">
    <div class="field"><label for="pre">คะแนนก่อนเรียน</label><textarea id="pre">${esc(c.pre)}</textarea></div>
    <div class="field"><label for="post">คะแนนหลังเรียน</label><textarea id="post">${esc(c.post)}</textarea></div>
    <div class="field"><label for="full">คะแนนเต็ม</label><input id="full" inputmode="numeric" value="${esc(c.full)}"></div>
   </div>
   <div class="actions" style="justify-content:flex-start"><button class="btn btn-primary" data-act="calc">คำนวณ</button></div>
   ${out}
   <div class="actions"><button class="btn btn-ghost" data-act="home">กลับหน้าแรก</button></div>
  </main></div>${toastHTML()}`;
}

/* ---------- render ---------- */
function render(){
  const v = {start:viewStart, room:viewRoom, roomDone:viewRoomDone, door:viewDoor, result:viewResult, teacher:viewTeacher}[state.screen];
  app.innerHTML = v();
}
function go(screen){ state.screen = screen; render(); window.scrollTo({top:0, behavior: reduce ? 'auto' : 'smooth'}); }

/* ---------- checking ---------- */
function okFb(S,x,extra){ return {kind:'ok', title:`ถูกต้อง ได้ ${fmt(x.score)} จาก ${S.pts} คะแนน`, answer:extra, reason:S.ok, evidence:S.ev}; }
function check(){
  const S = step(), x = rec(); if (x.done) return;
  if (S.type === 'equip' || S.type === 'choice'){
    if (x.sel == null) return;
    const label = S.type === 'equip' ? EQUIP[x.sel].name : S.opts[x.sel].t;
    if (x.sel === S.ans){ x.done = true; x.score = r1(S.pts * factor(x));
      x.fb = okFb(S,x,label); if (S.type === 'equip') x.fb.reason = `${EQUIP[S.ans].name}ใช้${EQUIP[S.ans].use} ตรงกับงานที่ต้องการ`;
    } else {
      x.wrong++; x.tried.push(x.sel); loseTube();
      const why = S.type === 'equip' ? `${EQUIP[x.sel].name}ใช้${EQUIP[x.sel].use} แต่โจทย์ต้องการ${S.need}` : S.opts[x.sel].why;
      if (x.wrong >= 2){ x.done = true; x.score = 0;
        const right = S.type === 'equip' ? EQUIP[S.ans].name : S.opts[S.ans].t;
        x.fb = {kind:'reveal', title:'เฉลยข้อนี้', answer:`คำตอบที่ถูกคือ “${right}”`, reason:(S.type === 'equip' ? `${EQUIP[S.ans].name}ใช้${EQUIP[S.ans].use}` : S.ok) + ` ส่วน “${label}” ไม่ถูก เพราะ${why}`, evidence:S.ev};
      } else x.fb = {kind:'bad', title:'ยังไม่ถูก ลองอีกครั้ง', answer:`คุณเลือก “${label}”`, reason:why, evidence:S.ev};
      x.sel = null;
    }
  } else if (S.type === 'predict'){
    if (x.sel == null) return;
    x.done = true; x.predOk = x.sel === S.ans; x.score = x.predOk ? r1(S.pts * hintFactor(x)) : 0;
    x.fb = {kind:'note', title:'บันทึกการคาดการณ์แล้ว', answer:`ฉันคาดว่า: ${S.opts[x.sel].t}`, reason:'ไปที่โต๊ะทดลองเพื่อตรวจสอบว่าสิ่งที่คาดไว้เกิดขึ้นจริงหรือไม่'};
  } else if (S.type === 'sort'){
    const bad = S.items.map((it,i) => x.place[i] !== it.ans ? i : -1).filter(i => i >= 0);
    if (x.frac == null) x.frac = (S.items.length - bad.length) / S.items.length;
    if (!bad.length){ x.done = true; x.score = r1(S.pts * x.frac * hintFactor(x)); x.fb = okFb(S,x,'จัดกลุ่มถูกครบทั้ง 6 ชนิด'); }
    else { x.wrong++; loseTube(); x.bad = bad;
      if (x.wrong >= 2){ bad.forEach(i => x.place[i] = S.items[i].ans); x.done = true; x.score = r1(S.pts * x.frac * hintFactor(x));
        x.fb = {kind:'reveal', title:`เฉลยการจัดกลุ่ม ได้ ${fmt(x.score)} จาก ${S.pts} คะแนน`, reason:S.ok, list:bad.map(i => `<b>${S.items[i].n}</b>: ${S.items[i].why}`)}; }
      else x.fb = {kind:'bad', title:`ยังจัดกลุ่มไม่ถูก ${bad.length} ชนิด`, reason:'สารที่มีกรอบสีแดงยังอยู่ผิดกลุ่ม อ่านผลการสังเกตของสารนั้นอีกครั้ง แล้วย้ายไปกลุ่มที่ถูกต้อง', evidence:S.ev};
    }
  } else if (S.type === 'table'){
    const bad = S.rows.map((r,i) => x.cells[i] !== r.ans ? i : -1).filter(i => i >= 0);
    if (x.frac == null) x.frac = (S.rows.length - bad.length) / S.rows.length;
    if (!bad.length){ x.done = true; x.score = r1(S.pts * x.frac * hintFactor(x)); x.fb = okFb(S,x,'บันทึกถูกครบทั้ง 5 แถว'); }
    else { x.wrong++; loseTube(); x.bad = bad;
      if (x.wrong >= 2){ bad.forEach(i => x.cells[i] = S.rows[i].ans); x.done = true; x.score = r1(S.pts * x.frac * hintFactor(x));
        x.fb = {kind:'reveal', title:`เฉลยตารางบันทึก ได้ ${fmt(x.score)} จาก ${S.pts} คะแนน`, reason:S.ok, list:bad.map(i => `<b>${S.rows[i].n}</b>: หลังผสมคือ “${S.rows[i].opts[S.rows[i].ans]}”`)}; }
      else x.fb = {kind:'bad', title:`ยังบันทึกไม่ตรง ${bad.length} แถว`, reason:'แถวสีแดงยังไม่ตรงกับการทดลอง กด “ดูการทดลองอีกครั้ง” แล้วแก้ไข', evidence:S.ev};
    }
  } else if (S.type === 'order'){
    const ok = x.order.every((v,i) => v === i);
    if (ok){ x.done = true; x.score = r1(S.pts * factor(x)); x.fb = okFb(S,x,'เรียงถูกทุกขั้น'); }
    else { x.wrong++; loseTube();
      if (x.wrong >= 2){ x.done = true; x.score = 0; x.fb = {kind:'reveal', title:'เฉลยลำดับขั้นตอน', reason:S.ok, evidence:S.ev}; }
      else { const first = x.order.findIndex((v,i) => v !== i); x.fb = {kind:'bad', title:'ลำดับยังไม่ถูก ลองอีกครั้ง', answer:`ขั้นที่ ${first+1} ยังไม่ถูกตำแหน่ง`, reason:'ลองคิดว่าต้องทำอะไรก่อน จึงจะทำขั้นต่อไปได้', evidence:S.ev}; }
    }
  } else if (S.type === 'multi'){
    const want = S.opts.map((o,i) => o.c ? i : -1).filter(i => i >= 0);
    const extra = x.multi.filter(i => !S.opts[i].c), missing = want.filter(i => !x.multi.includes(i));
    if (!extra.length && !missing.length){ x.done = true; x.score = r1(S.pts * factor(x)); x.fb = okFb(S,x, want.map(i => S.opts[i].t).join(' และ ')); }
    else { x.wrong++; loseTube();
      const list = extra.map(i => `<b>${S.opts[i].t}</b>: ${S.opts[i].why}`); if (missing.length) list.push(`ยังขาดหลักฐานอีก ${missing.length} ข้อ`);
      if (x.wrong >= 2){ x.done = true; x.score = 0; x.multi = want; x.fb = {kind:'reveal', title:'เฉลยข้อนี้', answer:want.map(i => S.opts[i].t).join(' และ '), reason:S.ok, list:extra.map(i => `<b>${S.opts[i].t}</b>: ${S.opts[i].why}`), evidence:S.ev}; }
      else x.fb = {kind:'bad', title:'ยังไม่ถูก ลองอีกครั้ง', list, evidence:S.ev};
    }
  }
  render();
}

/* ---------- events ---------- */
const ACT = {
  start(){
    const name = document.getElementById('pname').value.trim();
    state.player = {name, cls:document.getElementById('pcls').value.trim(), no:document.getElementById('pno').value.trim()};
    if (!name){ state.startErr = 'กรอกชื่อ–นามสกุลก่อนเข้าห้องทดลอง เพื่อให้ครูบันทึกคะแนนได้'; render(); document.getElementById('pname').focus(); return; }
    Object.assign(state, {startErr:'', room:0, step:0, rec:{}, tubes:3, refills:0, hintsTotal:0, wrongTotal:0, t0:Date.now(), t1:null, door:'', doorMsg:'', saved:false, copyText:''});
    go('room');
  },
  pick(b){ const x = rec(); if (x.done) return; x.sel = b.dataset.k ?? Number(b.dataset.i); render(); },
  toggle(b){ const x = rec(), i = Number(b.dataset.i); x.multi = x.multi.includes(i) ? x.multi.filter(v => v !== i) : [...x.multi, i]; render(); },
  place(b){ const x = rec(); x.place[Number(b.dataset.i)] = Number(b.dataset.b); render(); },
  orderTap(b){ const x = rec(); x.order.push(Number(b.dataset.i)); if (x.fb && x.fb.kind === 'bad') x.fb = null; render(); },
  orderUndo(){ rec().order.pop(); render(); },
  orderReset(){ rec().order = []; render(); },
  hint(){ const S = step(), x = rec(); if (x.done || x.hints >= 2) return; x.hints++; state.hintsTotal++; render(); },
  check,
  run(b){
    if (state.running) return; state.running = true; b.disabled = true;
    const svg = app.querySelector('svg.scene');
    playScene(svg, () => { state.running = false; rec().done = true; render(); });
  },
  replay(){ const svg = app.querySelector('svg.scene'); if (svg && !state.running){ state.running = true; playScene(svg, () => { state.running = false; }); } },
  matchPick(b){
    const x = rec(), lp = lastPredict(), i = Number(b.dataset.i), truth = lp && lp.x.predOk ? 0 : 1;
    x.sel = i; x.done = true; x.matchOk = i === truth;
    const said = lp.S.opts[lp.x.sel].t, res = lp.S.result;
    x.fb = x.matchOk
      ? {kind:'ok', title: truth === 0 ? 'ใช่ ผลตรงกับที่คาดการณ์' : 'ใช่ ผลแตกต่างจากที่คาดการณ์', reason: truth === 0 ? `การคาดการณ์ของคุณได้ ${fmt(lp.x.score)} จาก ${lp.S.pts} คะแนน เพราะใช้ข้อมูลในสมุดบันทึกได้ถูกต้อง` : 'การยอมรับว่าผลไม่ตรงกับที่คาด เป็นสิ่งที่นักวิทยาศาสตร์ต้องทำ ข้อมูลจริงสำคัญกว่าความคาดหวัง', evidence:`คาดไว้: ${said} · ผลจริง: ${res}`}
      : {kind:'note', title:'ลองเทียบอีกครั้ง', reason: truth === 0 ? 'สิ่งที่คุณคาดไว้ตรงกับผลจริง' : 'สิ่งที่คุณคาดไว้ไม่ตรงกับผลจริง นักวิทยาศาสตร์ต้องเทียบสิ่งที่คาดกับข้อมูลจริงอย่างตรงไปตรงมา', evidence:`คาดไว้: ${said} · ผลจริง: ${res}`};
    render();
  },
  next(){
    const R = room();
    if (state.step < R.steps.length - 1){ state.step++; render(); app.querySelector('.step-meta')?.scrollIntoView({block:'start', behavior: reduce ? 'auto' : 'smooth'}); }
    else go('roomDone');
  },
  roomNext(){ if (state.room < ROOMS.length - 1){ state.room++; state.step = 0; go('room'); } else { state.door = ''; state.doorMsg = ''; go('door'); } },
  key(b){ if (state.door.length < 6){ state.door += b.dataset.n; state.doorMsg = ''; render(); } },
  del(){ state.door = state.door.slice(0,-1); render(); },
  enter(){
    if (state.door.length < 6){ state.doorMsg = 'ใส่รหัสให้ครบ 6 หลัก'; render(); return; }
    if (state.door !== CODE){ state.doorMsg = 'รหัสไม่ถูกต้อง ลองเรียงชิ้นส่วนตามลำดับห้อง 1 ถึง 6'; state.door = ''; render(); return; }
    state.t1 = Date.now();
    const list = loadHistory(); list.push(resultRecord()); state.saved = saveHistory(list);
    go('result');
  },
  copyResult(){ const r = resultRecord(); copyOut(CSV_HEAD + '\n' + csvRow(r)); },
  copyHistory(){ const list = loadHistory(); copyOut(CSV_HEAD + '\n' + list.map(csvRow).join('\n')); },
  clearAsk(){ state.confirmClear = true; render(); },
  clearNo(){ state.confirmClear = false; render(); },
  clearYes(){ saveHistory([]); state.confirmClear = false; state.copyText = ''; toast('ลบผลการเล่นทั้งหมดในเครื่องนี้แล้ว'); render(); },
  teacher(){ state.copyText = ''; go('teacher'); },
  home(){ state.copyText = ''; go(state.t1 && state.player.name ? 'result' : 'start'); },
  again(){ const p = state.player; state = fresh(); state.player = p; go('start'); },
  calc(){
    const pre = document.getElementById('pre').value, post = document.getElementById('post').value, full = document.getElementById('full').value;
    const a = parseNums(pre), b = parseNums(post);
    const c = {pre, post, full, example: pre.trim() === EX_PRE && post.trim() === EX_POST};
    if (a.some(isNaN) || b.some(isNaN)) c.error = 'มีค่าที่ไม่ใช่ตัวเลข ตรวจสอบข้อมูลอีกครั้ง';
    else if (a.length !== b.length) c.error = `จำนวนคะแนนไม่เท่ากัน: ก่อนเรียน ${a.length} ค่า หลังเรียน ${b.length} ค่า`;
    else if (a.length < 3) c.error = 'ต้องมีคะแนนอย่างน้อย 3 คน';
    else c.result = pairedT(a,b);
    state.calc = c; render();
  },
  copySentence(){ const t = document.getElementById('sentence'); copyOut(t.value, t); },
};
function copyOut(text, el){
  const done = () => toast('คัดลอกแล้ว วางในไฟล์หรือข้อความได้เลย');
  const fallback = () => { if (!el){ state.copyText = text; render(); el = document.getElementById('copybox'); } el.focus(); el.select(); toast('กดค้างหรือกด Ctrl+C เพื่อคัดลอกข้อความที่เลือกไว้'); };
  try { navigator.clipboard.writeText(text).then(done, fallback); } catch(e){ fallback(); }
}
app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const f = ACT[b.dataset.act]; if (f) f(b);
});
app.addEventListener('change', e => {
  const s = e.target.closest('[data-cell]'); if (!s) return;
  const x = rec(); x.cells[Number(s.dataset.cell)] = s.value === '' ? undefined : Number(s.value);
  if (s.value === '') delete x.cells[Number(s.dataset.cell)];
  render();
});
app.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('#pname,#pcls,#pno')) ACT.start();
});

/* ---------- boot (keeps progress across live updates) ---------- */
function boot(data){ if (data && data.state && data.state.screen){ state = Object.assign(fresh(), data.state, {running:false, toast:''}); } render(); }
try { window.claude?.hot?.snapshot?.(() => ({state})); } catch(e){}
if (window.claude?.hot?.ready) window.claude.hot.ready(boot); else boot(window.claude?.hot?.data ?? {});
window.__sciLab = {pairedT, ibeta, ROOMS, SKILLS, getState: () => state, ACT, check, render, rec};
})();
</script>
